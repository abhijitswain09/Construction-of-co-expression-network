name: Nextflow smoke test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
      - run: nextflow run . -profile test -stub --outdir results
